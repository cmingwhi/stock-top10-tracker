name: 📊 每日台股成交量爬蟲

on:
  # 定時觸發：每天台灣時間晚上 8:30 (UTC 12:30)
  schedule:
    - cron: '30 12 * * *'
  
  # 手動觸發
  workflow_dispatch:
  
  # 推送到 main 分支時也執行一次（測試用）
  push:
    branches: [ main ]
    paths:
      - 'crawler/**'
      - 'requirements.txt'
      - 'frontend/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  crawl-and-deploy:
    name: 爬取成交量排行並部署
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: 🕷️ Run crawler
        id: crawler
        run: |
          cd crawler
          python daily_volume_crawler.py once
        continue-on-error: true
          
      - name: 📂 Prepare deployment files
        run: |
          mkdir -p frontend/data/history
          
          if [ -f crawler/data/latest.json ]; then
            cp crawler/data/latest.json frontend/data/
            echo "✅ 已複製 latest.json"
          else
            echo "⚠️ 未找到 latest.json，建立範例資料"
            echo '{"date":"20260505","update_time":"2026-05-05T10:00:00","top10":[],"message":"今日無交易資料或爬蟲尚未執行"}' > frontend/data/latest.json
          fi
          
          if [ -d crawler/data/history ]; then
            cp -r crawler/data/history/* frontend/data/history/ 2>/dev/null || true
          fi
          
          if [ ! -f frontend/index.html ]; then
            echo "❌ 錯誤：找不到 frontend/index.html"
            exit 1
          fi
          
          echo "📁 部署目錄結構："
          ls -la frontend/
          
      - name: 📤 Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend
          
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4