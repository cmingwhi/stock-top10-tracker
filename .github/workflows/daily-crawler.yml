name: 📊 每日台股成交量爬蟲

on:
  # 定時觸發：每天台灣時間下午 6 點 (UTC 10:00)
  schedule:
     # 修改為 UTC 12:30 (台灣時間 20:30)
    - cron: '30 12 * * *'
  
  # 手動觸發：可以從 GitHub Actions 頁面手動執行
  workflow_dispatch:
  
  # 推送到 main 分支時也執行一次（測試用）
  push:
    branches: [ main ]
    paths:
      - 'crawler/**'
      - 'requirements.txt'
      - 'frontend/**'

# 設定權限，允許部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 避免同時執行多個部署
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  crawl-and-deploy:
    name: 爬取成交量排行並部署
    runs-on: ubuntu-latest
    
    # ⭐ 關鍵修正：加入 environment 設定
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      # 1. 檢出程式碼
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      # 2. 設定 Python 環境
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      # 3. 安裝依賴套件
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      # 4. 執行爬蟲程式
      - name: 🕷️ Run crawler
        id: crawler
        run: |
          cd crawler
          python daily_volume_crawler.py once
        continue-on-error: true  # 即使爬蟲失敗也繼續部署（可能非交易時段）
        
      # 5. 準備部署檔案（複製到 frontend 目錄）
      - name: 📂 Prepare deployment files
        run: |
          # 確保目錄結構正確
          mkdir -p frontend/data/history
          
          # 複製爬蟲產生的資料（如果存在的話）
          if [ -f crawler/data/latest.json ]; then
            cp crawler/data/latest.json frontend/data/
            echo "✅ 已複製 latest.json"
            cat frontend/data/latest.json | head -5
          else
            echo "⚠️ 未找到 latest.json，建立範例資料"
            # 建立一個範例 JSON，避免頁面完全空白
            echo '{"date":"20260505","update_time":"2026-05-05T10:00:00","top10":[],"message":"今日無交易資料或爬蟲尚未執行"}' > frontend/data/latest.json
          fi
          
          # 複製歷史資料（如果有的話）
          if [ -d crawler/data/history ]; then
            cp -r crawler/data/history/* frontend/data/history/ 2>/dev/null || true
            echo "✅ 已複製歷史資料，共 $(ls crawler/data/history/ 2>/dev/null | wc -l) 筆"
          fi
          
          # 確認入口檔案存在
          if [ ! -f frontend/index.html ]; then
            echo "❌ 錯誤：找不到 frontend/index.html"
            exit 1
          fi
          
          # 顯示部署目錄結構（除錯用）
          echo "📁 部署目錄結構："
          ls -la frontend/
          echo "📁 data 目錄："
          ls -la frontend/data/ 2>/dev/null || echo "data 目錄為空"
          
      # 6. 上傳 Pages artifact（GitHub 官方方式）
      - name: 📤 Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend
          
      # 7. 部署到 GitHub Pages（GitHub 官方方式）
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4