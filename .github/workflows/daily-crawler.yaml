name: 📊 每日台股成交量爬蟲

on:
  # 定時觸發：每天台灣時間下午 6 點 (UTC+8)
  schedule:
    - cron: '0 10 * * *'  # UTC 10:00 = 台灣 18:00
    
  # 手動觸發：可以從 GitHub Actions 頁面手動執行
  workflow_dispatch:
  
  # 推送到 main 分支時也執行一次（測試用）
  push:
    branches: [ main ]
    paths:
      - 'crawler/**'
      - 'requirements.txt'

jobs:
  crawl-and-deploy:
    name: 爬取成交量排行並部署
    runs-on: ubuntu-latest
    
    # 設定權限，允許部署到 GitHub Pages
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      # 1. 檢出程式碼
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      # 2. 設定 Python 環境
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      # 3. 安裝依賴套件
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      # 4. 執行爬蟲程式
      - name: 🕷️ Run crawler
        run: |
          cd crawler
          python daily_volume_crawler.py once
        env:
          # 可以設定環境變數（如果需要通知等功能）
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      # 5. 複製資料到前端目錄
      - name: 📂 Copy data to frontend
        run: |
          mkdir -p frontend/data
          cp crawler/data/latest.json frontend/data/ 2>/dev/null || echo "No data yet"
          cp crawler/data/history/*.json frontend/data/history/ 2>/dev/null || mkdir -p frontend/data/history
          
      # 6. 部署到 GitHub Pages
      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend
          publish_branch: gh-pages
          destination_dir: ./
          keep_files: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: '自動更新：${{ github.run_id }}'
          
      # 7. 可選：發送通知到 Discord / Telegram / Slack
      - name: 💬 Send notification (optional)
        if: always()
        run: |
          echo "✅ Workflow completed at $(date)"
          # 在這裡可以加入 webhook 通知